# Standalone console backend. It does not depend on a local CS2 container.
services:
  panel-backend:
    build:
      context: ./backend
    container_name: cs2-panel-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      PANEL_CORS_ALLOWED_ORIGINS: ${PANEL_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      # Keep the API private; expose it through an HTTPS reverse proxy.
      - "127.0.0.1:8080:8080"
