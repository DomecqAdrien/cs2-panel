server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cs2-panel-backend

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

panel:
  cors:
    allowed-origins: ${PANEL_CORS_ALLOWED_ORIGINS:http://localhost:4200}

rcon:
  connect-timeout-ms: ${RCON_CONNECT_TIMEOUT_MS:3000}
  response-timeout-ms: ${RCON_RESPONSE_TIMEOUT_MS:5000}
