server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cs2-panel-backend

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

panel:
  admin:
    username: ${PANEL_ADMIN_USERNAME:admin}
    password: ${PANEL_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${PANEL_CORS_ALLOWED_ORIGINS:http://localhost:4200}

cs2:
  rcon:
    host: ${CS2_RCON_HOST:cs2}
    port: ${CS2_RCON_PORT:27050}
    public-ip: ${CS2_SERVER_PUBLIC_IP}
    connect-timeout-ms: ${CS2_RCON_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${CS2_RCON_RESPONSE_TIMEOUT_MS:5000}
